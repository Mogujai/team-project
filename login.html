<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>reVision - Login</title>
        <link rel="stylesheet" href="styles.css">
    </head>

<body>
    <nav class="navbar">
        <div class="navbar_container">
            <a href="#" id="navbar_logo">reVision</a>
            <div class="navbar_toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="navbar_menu">
                <li class="navbar_item">
                    <a href="./index.html" class="navbar_links">Home</a>
            </ul>
        </div>
    </nav>
    <div class="loginsignup_form">
        <form id="loginForm">
            <div id="login-container">
                <h1 id="logo-container">reVision</h1>
                <h2>Login</h2>

                <input class="login_input" id="username" type="text" placeholder="Username" name="username" required>
                <input class="login_input" id="password" type="password" placeholder="Password" name="password" required>

                <button class="login_input" id="login_button" type="submit">Login</button>

                <div id="message" style="margin-top: 1rem; font-size: 0.95rem; min-height: 1.4rem;"></div>

                <p>Don't have an account? <a href="./signup.html">Sign Up</a></p>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
